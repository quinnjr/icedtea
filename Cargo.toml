[workspace]
resolver = "2"
members = ["contract", "config", "compositor", "clipboard", "harness", "shell", "settings", "notifications", "ui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
zbus = "5"
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
image = "0.25"

# Dependencies are optimised even in the dev profile: skia-rs (pure-Rust
# rasteriser) at opt-level 0 paints a settings-window frame in ~18 s, which
# turned the harness-driven gates into minutes-long waits (M5 P2-D19). Workspace
# crates keep opt-level 0 for fast rebuilds and debuggability; only the
# dependency graph is optimised, and only once per target dir.
[profile.dev.package."*"]
opt-level = 2

# Dev-only: develop the compositor against the unreleased M8 IME depth work
# (reposition event + popup size accessor) living in the wlr-m8-ime worktree,
# before it is frozen and published as wlr 0.20.32. The patch must live here
# at the workspace root, not as a dep swap in `compositor/Cargo.toml`: `wlr-sys`
# carries `links = "wlroots"`, so a path `wlr` and the published `wlr` cannot
# coexist in one graph — patching the registry source is the only way to keep a
# single `wlr`/`wlr-sys` pair. Dropped when 0.20.32 publishes.
[patch.crates-io]
wlr = { path = "/home/joseph/Projects/wlroots-sys/.worktrees/wlr-m8-ime/crates/wlr" }

