[workspace]
resolver = "2"
members = ["contract", "config", "compositor", "clipboard", "harness", "shell"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
zbus = "5"
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
image = "0.25"

# TEMPORARY: pointer-constraints + relative-pointer support (wlr 0.20.21)
# consumed from wlroots-sys before publish. Remove once 0.20.21 ships.
[patch.crates-io]
wlr = { path = "../wlroots-sys/crates/wlr" }
