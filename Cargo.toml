[workspace]
resolver = "2"
members = ["contract", "config", "compositor", "clipboard", "harness", "shell"]

# TEMPORARY (M4.4 dev cycle): pin against the local wlr crate on
# feature/wlr-m4.4 until wlr 0.20.20 is published. Drop this after publish.
[patch.crates-io]
wlr = { path = "../wlroots-sys/crates/wlr" }

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
zbus = "5"
redb = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel = "0.5"
image = "0.25"
