[package]
name = "icedtea-compositor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "icedtea_compositor"
path = "src/lib.rs"

[[bin]]
name = "icedtea-compositor"
path = "src/main.rs"

[dependencies]
icedtea-contract = { path = "../contract" }
icedtea-config = { path = "../config" }
# NOTE (review finding M3): `serde`, `serde_json`, and `redb` used to be
# declared here with no reference anywhere in `compositor/src` -- config
# persistence is entirely the `icedtea-config` crate's job. Dropped.
tracing.workspace = true
tracing-subscriber.workspace = true
crossbeam-channel.workspace = true
image.workspace = true
zbus.workspace = true
bitflags = "2"
# Keysym name <-> keysym resolution for `input.rs`'s keybinding matcher.
# Depended on directly now that the compositor library re-export that used
# to provide it is gone.
xkbcommon = "0.8"

# The compositor library. crates.io only, pinned to the release that froze
# the API this crate uses — never a path or git dependency (a path dep would
# put an unpublished wlr-sys in the graph, and `links = "wlroots"` makes that
# unresolvable the moment anything else pulls the published one).
wlr = "0.20.9"

# Title-bar text shaping and glyph rasterization for server-side
# decorations (`text.rs`). Chosen over a bare rasterizer because SSD titles
# are arbitrary client strings: cosmic-text brings system font enumeration,
# per-run font fallback (CJK, emoji) and complex-script shaping, none of
# which we want to reimplement. Only the CPU rasterization path is used --
# the glyphs land in an RGBA buffer node, not in a GPU pipeline.
cosmic-text = "0.14"

# SIGINT/SIGTERM without writing any unsafe: `low_level::pipe::register`
# installs a handler that writes one byte to a socket, and the read end
# becomes an ordinary wlr fd source. signalfd(2) would need `unsafe` in this
# crate, which the project's unsafe policy does not permit.
signal-hook = "0.3"

# Borrowed-fd reads for the shutdown source's handler. `FdHandler::fd_ready`
# hands out a BorrowedFd that must not be closed, which rules out wrapping it
# in a File.
rustix = { version = "1", features = ["std"] }

[dev-dependencies]
tempfile = "3"
wlr = "0.20.9"
crossbeam-channel.workspace = true
signal-hook = "0.3"

# The client half of `tests/support`: a real wayland client that speaks
# xdg-shell to the compositor under test over a real socket. Dev-only --
# nothing in `src/` is a wayland *client*.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
# `memfd_create`/`ftruncate` for the shm buffer the test client attaches.
# `rustix` is already a normal dependency (features = ["std"]); these extra
# features are additive and only reach the test binaries.
rustix = { version = "1", features = ["fs", "mm", "shm"] }
