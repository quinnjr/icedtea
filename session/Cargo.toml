[package]
name = "icedtea-session"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
icedtea-contract = { path = "../contract" }
icedtea-registry = { path = "../registry" }
icedtea-registry-schema = { path = "../registry-schema" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
zbus.workspace = true
futures-util = "0.3"
rustix = { version = "1", features = ["process", "event", "fs"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
icedtea-harness = { path = "../harness" }
icedtea-compositor = { path = "../compositor" }
tempfile = "3"
