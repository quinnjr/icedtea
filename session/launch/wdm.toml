# Container harness, not DE architecture: wdm is this box's display manager and
# this config is checked in so provisioning is reproducible. Nothing in the
# DE's own session layer (the units, `icedtea.desktop`, `icedtea-session-start`)
# names or depends on wdm.
vt = 7
default_session = "icedtea.desktop"

[greeter]
command = "/usr/lib/wdm/wdm-webkit-greeter --theme default"
user = "wdm"

[keyboard]
layout = "us"
