[package]
name = "icedtea-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

# A pure-Rust, GTK4-theme-compatible UI layer: no gtk4/gio/glib/pango/cairo/gdk,
# and no Smithay (these are Wayland *clients*; wlroots is the server side).

[dependencies]
skia-rs-safe = { version = "0.4.0", default-features = false, features = [
    "std",
    "text",
    "codec",
    "codec-png",
    "svg",
] }
bitflags = "2"
# M6 accesskit slice: the in-process a11y tree (`ui/src/a11y.rs`) builds
# `accesskit::TreeUpdate`s. Optional so `--no-default-features` keeps the
# old tree; the AT-SPI bus adapter over it lives in `ui/src/a11y_bus.rs`
# behind its own `a11y-bus` feature.
accesskit = { version = "0.25", optional = true }
# M6 accesskit bus slice: `ui/src/a11y_bus.rs` feeds those `TreeUpdate`s to
# the AT-SPI bus. 0.23.0 (2026-08-29) pairs with `accesskit ^0.25`, so the
# two crates share one schema; optional and behind its own `a11y-bus`
# feature so the default build links no D-Bus.
#
# `async-io` is accesskit_unix's only needed feature and cannot be dropped:
# its `lib.rs` hard-errors unless `async-io` or `tokio` is enabled. It pulls
# the crate's async runtime; the `zbus`/`atspi` chain is unconditional either
# way, so listing it explicitly beats relying on `default`.
accesskit_unix = { version = "0.23", optional = true, default-features = false, features = [
    "async-io",
] }
cssparser = "0.37"
selectors = "0.40"
precomputed-hash = "0.1"
taffy = "0.14"
# Grapheme-cluster and word boundaries for TextLayout's caret movement, and
# UAX #14 line-break opportunities for its word wrapping. Both already resolve
# in the workspace lockfile (cosmic-text pulls them under skia-rs-text), so
# neither adds a crate to the tree.
unicode-segmentation = "1.13"
unicode-linebreak = "0.1"
fontconfig = { version = "0.11", optional = true }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
xkbcommon = "0.9"
rustix = { version = "1", features = ["fs", "event", "pipe"] }
crossbeam-channel.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[features]
default = ["fontconfig", "a11y"]
# Real `fc-match` parity: aliases, generic families and the user's own
# `~/.config/fontconfig` rules. Off, `FontDatabase::new` is
# `FontDatabase::probe_only` -- the fixed `FONT_CANDIDATES` list -- which is
# what a stripped container or a build that must not link libfontconfig
# wants, and is already the fallback when `FcInit` fails.
fontconfig = ["dep:fontconfig"]
# M6 accesskit slice: `ui/src/a11y.rs` and its `ui/tests/a11y.rs` gate.
a11y = ["dep:accesskit"]
# M6 accesskit bus slice: the AT-SPI adapter (`ui/src/a11y_bus.rs`) over
# `accesskit_unix`. Off by default: it pulls zbus/atspi and starts a D-Bus
# event loop, which only a live desktop session wants. Implies `a11y`.
a11y-bus = ["a11y", "dep:accesskit_unix"]

[dev-dependencies]
icedtea-harness = { path = "../harness" }
# `support::wait_for_probe_window` hands back the compositor's own
# `WindowInfo`; a test's poll loop over `Compositor::snapshot` has nowhere
# else to name that type.
icedtea-contract = { path = "../contract" }
icedtea-compositor = { path = "../compositor" }
tempfile = "3"

[[test]]
name = "a11y_bus"
path = "tests/a11y_bus.rs"
# The file is `#![cfg(feature = "a11y-bus")]`, so without this it compiles
# to an empty binary and no gate ever exercises the bus. `required-features`
# makes `cargo test -p icedtea-ui --features a11y-bus` the real gate; the
# default run skips the target instead of passing vacuously.
required-features = ["a11y-bus"]

[[bin]]
name = "themed-button"
path = "src/bin/themed-button.rs"

[[bin]]
name = "window-probe"
path = "src/bin/window-probe.rs"

[[bin]]
name = "gallery"
path = "src/bin/gallery.rs"
